version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5432:5432"

  redis:
    image: redis:7

    container_name: airflow-redis

    ports:
      - "6379:6379"
