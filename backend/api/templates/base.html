<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AirFlow{% endblock %}</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --muted:#94a3b8; --text:#e2e8f0;
            --border:#334155; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
           background:var(--bg); color:var(--text); }
    header { background:var(--panel); border-bottom:1px solid var(--border);
             padding:14px 24px; display:flex; align-items:center; gap:24px; }
    header h1 { font-size:18px; margin:0; }
    header a { color:var(--muted); text-decoration:none; font-size:14px; }
    header a:hover { color:var(--accent); }
    main { padding:24px; max-width:1100px; margin:0 auto; }
    h2 { font-size:16px; border-bottom:1px solid var(--border); padding-bottom:8px; }
    table { width:100%; border-collapse:collapse; margin:12px 0 28px; font-size:14px; }
    th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:600; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { background:#020617; border:1px solid var(--border); border-radius:8px;
          padding:16px; overflow:auto; font-size:13px; line-height:1.5; }
    .badge { padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
    .success { background:#064e3b; color:#6ee7b7; }
    .failed  { background:#7f1d1d; color:#fca5a5; }
    .running { background:#1e3a8a; color:#93c5fd; }
    .queued  { background:#374151; color:#d1d5db; }
    .skipped { background:#422006; color:#fcd34d; }
    .muted { color:var(--muted); }
    .empty { color:var(--muted); padding:12px 0; }
    .btn { display:inline-block; background:var(--accent); color:#04263a;
           padding:7px 14px; border-radius:7px; font-weight:600; font-size:13px;
           border:none; cursor:pointer; }
    .btn:hover { filter:brightness(1.1); text-decoration:none; }
    .card { background:var(--panel); border:1px solid var(--border);
            border-radius:10px; padding:16px 18px; margin:14px 0; }
    .row { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
    .graph { background:#020617; border:1px solid var(--border);
             border-radius:8px; padding:12px; overflow:auto; }
    form.inline { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
    label.field { display:flex; flex-direction:column; gap:4px; font-size:13px;
                  color:var(--muted); }
    input, textarea { background:#0b1220; border:1px solid var(--border);
                      color:var(--text); border-radius:6px; padding:7px 9px;
                      font-size:14px; }
    /* grid view */
    .grid td, .grid th { text-align:center; padding:5px; }
    .grid .taskname { text-align:left; white-space:nowrap; }
    .cell { display:inline-block; width:16px; height:16px; border-radius:3px;
            background:#1f2937; }
    .cell.success { background:#10b981; } .cell.failed { background:#ef4444; }
    .cell.running { background:#3b82f6; } .cell.queued { background:#6b7280; }
    .cell.skipped { background:#f59e0b; }
    .bar { height:8px; border-radius:4px; background:#334155; overflow:hidden; }
    .bar > span { display:block; height:100%; background:var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>🌀 AirFlow</h1>
    <nav style="display:flex; gap:18px;">
      <a href="/">DAGs</a>
      <a href="/pools">Pools</a>
      <a href="/docs">API Docs</a>
      <a href="{{ adminer_url }}" target="_blank">Database</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
